# =============================================================================
# {{PROJECT_NAME}} — Redis (PERSISTENT): Queue + Sessions
# -----------------------------------------------------------------------------
# One of TWO Redis instances. This one holds data whose loss is a BUG:
#   - Queue jobs      — payment confirmations, deadline tasks, notifications
#   - User sessions   — losing these logs every user out
#
# The other instance (redis-cache, see redis-cache.conf) holds data whose loss is
# merely a performance event.
#
# WHY THE SPLIT
# A single instance serving both means cache growth competes for memory with
# queued jobs. Under any single-policy configuration one of two bad things
# happens: either Redis silently evicts a pending payment job (data loss that is
# nearly impossible to trace), or cache pressure blocks the queue from accepting
# new jobs (an outage caused by something disposable).
#
# Splitting them lets each side have the policy it actually needs, and is what
# makes `allkeys-lru` safe to use for cache.
# =============================================================================

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes
timeout 300
tcp-keepalive 300

# -----------------------------------------------------------------------------
# Memory — the critical difference from the cache instance
# -----------------------------------------------------------------------------
maxmemory 256mb

# `noeviction`: when memory is exhausted, REFUSE new writes with an OOM error
# rather than deleting something to make room.
#
# This is the correct failure mode here precisely because everything in this
# instance is irreplaceable. A rejected write surfaces immediately as a failed
# job dispatch that Laravel logs and retries. An eviction, by contrast, would
# silently delete a queued payment confirmation with no error anywhere.
#
# Loud failure beats silent data loss for anything touching money.
maxmemory-policy noeviction

# -----------------------------------------------------------------------------
# Persistence — enabled, because this data must survive a restart
# -----------------------------------------------------------------------------
# RDB snapshots at decreasing intervals as write volume rises.
save 3600 1
save 300 100
save 60 10000

# Refuse writes if a background save is failing: continuing to serve while
# unable to persist means a restart silently loses everything since the last
# good snapshot.
stop-writes-on-bgsave-error yes

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF gives second-level durability instead of the minutes RDB can lose.
# Left OFF here because it roughly doubles disk I/O and the development stack
# does not need it. In production, a managed Redis manages persistence itself —
# enable AOF there via the instance's persistence configuration, not this file.
appendonly no

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# Access control rests on `requirepass` (supplied on the command line, never
# committed) plus network isolation — this instance is on the internal `backend`
# network only.
#
# KEYS is disabled as an operational safeguard, not a security one: it walks the
# whole keyspace while blocking every other client, so one careless call during
# a traffic peak stalls the platform. SCAN does the same job incrementally.
#
# CONFIG, FLUSHDB, FLUSHALL and SHUTDOWN are deliberately NOT renamed — see
# redis-cache.conf for the full rationale (Redis 8's bundled modules call
# CONFIG GET during initialisation and crash if it is renamed).
rename-command KEYS ""

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logfile ""
loglevel notice

slowlog-log-slower-than 10000
slowlog-max-len 128

client-output-buffer-limit pubsub 32mb 8mb 60
