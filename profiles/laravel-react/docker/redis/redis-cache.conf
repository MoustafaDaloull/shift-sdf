# =============================================================================
# {{PROJECT_NAME}} — Redis (CACHE)
# -----------------------------------------------------------------------------
# One of TWO Redis instances. This one holds ONLY derived data:
#   - Application cache entries
#   - Rate-limiting counters
#
# Every key here can be recomputed from the database. Losing all of it costs
# some latency while the cache refills, and nothing else. That single property
# is what justifies every setting below.
#
# See redis-persistent.conf for the instance holding queue jobs and sessions,
# where the trade-offs are inverted.
# =============================================================================

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes
timeout 300
tcp-keepalive 300

# -----------------------------------------------------------------------------
# Memory — eviction is the DESIRED behaviour here
# -----------------------------------------------------------------------------
maxmemory 256mb

# `allkeys-lru`: when full, discard the least recently used key to make room.
#
# This is exactly what a cache should do, and it is only safe because this
# instance is physically separate from the queue. On a shared instance the same
# policy could evict a pending payment job; here the worst case is a cache miss
# that gets recomputed on the next request.
#
# Without eviction, a full cache would start REFUSING writes — turning a
# self-healing condition into an application error.
maxmemory-policy allkeys-lru

# Sample 10 keys per eviction instead of the default 5: closer to true LRU for
# a small extra CPU cost, which matters when the working set exceeds memory.
maxmemory-samples 10

# -----------------------------------------------------------------------------
# Persistence — deliberately DISABLED
# -----------------------------------------------------------------------------
# Nothing here is worth writing to disk. Persisting cache entries would:
#   - spend disk I/O on data that is cheaper to recompute than to restore,
#   - lengthen restart time while a stale snapshot loads,
#   - restore entries that may already be invalid.
#
# An empty cache after a restart is a correct, self-healing state.
save ""
appendonly no

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# `requirepass` is supplied on the command line so no secret lives in this
# committed file. The instance is on the internal `backend` network only.
#
# KEYS is disabled: it blocks the server while scanning the entire keyspace, and
# a cache is exactly where key counts grow large enough for that to hurt. SCAN
# is the incremental, non-blocking alternative and still works.
rename-command KEYS ""

# -----------------------------------------------------------------------------
# Commands deliberately NOT renamed
# -----------------------------------------------------------------------------
# CONFIG    — Redis 8 ships bundled modules (RediSearch, RedisBloom, vectorset)
#             that call CONFIG GET during initialisation. Renaming it makes the
#             search module fail an internal assertion and crash the server at
#             startup, with a crash report that never names the real cause.
#             Verified against redis:8.2-alpine — not assumed.
#
# FLUSHDB / FLUSHALL
#           — On a cache instance these are legitimate operational tools, and
#             `php artisan cache:clear` depends on them. Flushing this instance
#             is safe by construction: it holds nothing irreplaceable.
#
# Per-command restriction, if it is ever warranted, belongs in Redis ACLs
# (`ACL SETUSER app -keys ...`), which apply per user rather than globally and
# therefore do not break the server's own internals.

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logfile ""
loglevel notice

slowlog-log-slower-than 10000
slowlog-max-len 128

client-output-buffer-limit pubsub 32mb 8mb 60
