# =============================================================================
# {{PROJECT_NAME}} — Nginx main configuration
# -----------------------------------------------------------------------------
# Replaces the stock /etc/nginx/nginx.conf. Virtual hosts live in conf.d/ and
# reusable fragments in snippets/.
# =============================================================================

# Master runs as root only long enough to bind the port and read config; every
# worker that actually touches request data drops to the unprivileged `nginx`
# user. For a stricter posture (a managed platform does not need a privileged
# port) swap the base image for nginxinc/nginx-unprivileged.
user nginx;

# One worker per available core. Under cgroup limits Nginx reads the effective
# CPU quota, so this does the right thing on a CPU-capped instance instead of
# forking for every host core.
worker_processes auto;

# Raise the per-worker file-descriptor ceiling. Each client connection plus each
# upstream connection consumes one; the default (1024) is reached surprisingly
# early when proxying to FPM under load.
worker_rlimit_nofile 65535;

# Errors to stderr -> Docker -> the log collector. `notice` is the useful middle
# ground: it records worker lifecycle and config reloads without the per-request
# noise of `info`.
error_log /dev/stderr notice;

# Under Docker the container runtime owns process lifecycle; a stale pidfile on
# a read-only root filesystem prevents startup, so it lives on the /var/run
# tmpfs the compose files provide.
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    # Accept as many new connections as are pending, rather than one per loop
    # iteration. Meaningfully better under bursty load.
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # MIME and defaults
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    # JSON access logs. A log collector parses JSON payloads into structured
    # fields automatically, which makes them filterable without a log parser.
    # `escape=json` prevents a crafted header from breaking the JSON envelope.
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request_method":"$request_method",'
          '"request_uri":"$request_uri",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_response_time":"$upstream_response_time",'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_x_forwarded_for":"$http_x_forwarded_for",'
          '"request_id":"$request_id"'
        '}';

    access_log /dev/stdout json_combined;

    # -------------------------------------------------------------------------
    # Transfer efficiency
    # -------------------------------------------------------------------------
    # sendfile: copy static files kernel-to-socket, skipping user space.
    sendfile on;
    # tcp_nopush pairs with sendfile: fill a full packet before sending, instead
    # of dribbling out headers and body separately.
    tcp_nopush on;
    # tcp_nodelay disables Nagle for keepalive connections so small API JSON
    # responses are not delayed waiting for more data to batch.
    tcp_nodelay on;

    # -------------------------------------------------------------------------
    # Timeouts
    # -------------------------------------------------------------------------
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Defend against slow-loris: a client that opens a connection and dribbles
    # headers ties up a worker slot until one of these fires.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    reset_timedout_connection on;

    # -------------------------------------------------------------------------
    # Request size
    # -------------------------------------------------------------------------
    # Must be >= PHP's post_max_size (520M in docker/php/conf.d/10-base.ini) or
    # Nginx rejects large uploads with a 413 before PHP ever sees them,
    # producing a confusing error. The largest upload the product accepts
    # drives this number; keep the two files in step.
    client_max_body_size 520M;
    client_body_buffer_size 256k;
    # Buffer request bodies in memory up to the size above; spill to disk beyond.
    client_body_temp_path /tmp/nginx_client_body 1 2;

    # Large JWTs and forwarded headers overflow the 8k default behind a load
    # balancer that appends tracing headers.
    large_client_header_buffers 4 16k;

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    # Do not spend CPU compressing payloads too small to benefit — below roughly
    # one MTU the compressed result can be larger than the original.
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        application/rss+xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    # NOTE: images (JPEG/PNG/WebP) are already compressed; re-compressing them
    # burns CPU for no gain, so they are intentionally absent from the list.

    # -------------------------------------------------------------------------
    # Proxy / FastCGI buffering
    # -------------------------------------------------------------------------
    # Read the full FastCGI response into memory before streaming it to a slow
    # client. This frees the PHP worker immediately instead of holding it open
    # for the duration of a slow mobile connection — the single highest-value
    # tuning for PHP-FPM capacity.
    fastcgi_buffering on;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_path /tmp/nginx_fastcgi 1 2;

    # Ceiling on how long we wait for PHP. Set above PHP's max_execution_time
    # (60s) so PHP's own timeout produces a proper error page first, and this
    # only catches a wedged worker.
    fastcgi_read_timeout 75s;
    fastcgi_send_timeout 75s;
    fastcgi_connect_timeout 10s;

    # -------------------------------------------------------------------------
    # Identity and security
    # -------------------------------------------------------------------------
    # Suppress the version number in Server: and error pages. Version disclosure
    # tells an attacker exactly which CVEs to try.
    server_tokens off;

    # Generate a request id when the edge did not supply one, so a single
    # request can be correlated across Nginx, PHP, and the log collector.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Trust the client's scheme when it arrives from a terminating proxy (the
    # platform load balancer), otherwise fall back to our own. Laravel uses
    # this to build correct absolute https:// URLs behind TLS termination.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # PHP reads the CGI `HTTPS` variable to decide whether the request was
    # secure, and it must be either "on" or entirely absent — any other value
    # (including "off") is treated as truthy by some code paths. This map feeds
    # `fastcgi_param HTTPS $https_flag if_not_empty`, so the parameter is simply
    # not sent on plain HTTP.
    map $forwarded_scheme $https_flag {
        default "";
        "https" "on";
    }

    include /etc/nginx/conf.d/*.conf;
}
