# =============================================================================
# Content-Security-Policy — API responses
# -----------------------------------------------------------------------------
# The Laravel edge serves JSON, not documents. That makes its CSP both simple
# and maximally strict: there is no legitimate script, style, image, or frame in
# an API response, so EVERYTHING can be denied.
#
# WHY BOTHER WITH A CSP ON A JSON API AT ALL
# A CSP still matters here because an API can be induced to return a response a
# browser renders as HTML:
#   - an error page produced upstream of Laravel,
#   - a reflected value in a 4xx body with a sniffed content type,
#   - a file-download route serving user-uploaded content inline.
# In each case `default-src 'none'` means any injected script simply does not
# execute. Combined with X-Content-Type-Options: nosniff, this closes the
# reflected-XSS-via-API-response path entirely.
#
# This policy is intentionally NOT applied to the SPA vhost, where scripts and
# styles obviously must run — see csp-spa.conf.
#
# If the web origin must embed a file the API serves (a PDF viewer in an
# iframe, say), carve out that path with a `map $request_uri` in the vhost
# that answers `'none'` by default and the web origin for the file prefix, and
# feed it into `frame-ancestors` here and into X-Frame-Options in
# security-headers.conf. The reference project did exactly that for one prefix;
# the profile ships the strict default.
# =============================================================================

# default-src 'none'  — deny every resource type not explicitly allowed below.
# frame-ancestors     — nothing may embed an API response (defence in depth
#                       alongside X-Frame-Options, which older browsers use).
# base-uri 'none'     — block <base> injection, which can silently repoint every
#                       relative URL on a rendered page to an attacker origin.
# form-action 'none'  — no form in an API response may submit anywhere.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
