# =============================================================================
# Content-Security-Policy — React SPA
# -----------------------------------------------------------------------------
# Shipped in REPORT-ONLY mode deliberately. Read this before changing it.
#
# WHY REPORT-ONLY RATHER THAN ENFORCING
# A CSP must match what the application actually loads: its API origin, its font
# and image sources, and whether its build emits inline styles. Before the
# React application exists, any enforcing policy written now would be one of
# two useless things:
#   - so permissive ('unsafe-inline', 'unsafe-eval', https:) that it blocks no
#     real attack while creating the impression of protection, or
#   - so strict that it silently breaks the SPA on first deploy, in a way that
#     surfaces only as a blank page and a console error.
#
# Report-Only sends violation reports without blocking anything, so the real
# policy can be derived from observed behaviour instead of guessed. That is the
# standard way to roll out a CSP on an application that is still being built.
#
# HOW TO PROMOTE THIS TO ENFORCING (do this before public launch)
#   1. Run the SPA against a staging build with this header active.
#   2. Collect violation reports and confirm each one is either legitimate
#      (add the origin) or a genuine problem (fix the code).
#   3. Remove any 'unsafe-*' that turns out to be unnecessary. Vite's production
#      build does not need 'unsafe-eval'; its dev server does.
#   4. Rename the directive below to `Content-Security-Policy`.
#
# Tracked as an open item in docker/README.md until step 4 is done.
# =============================================================================

# Directive rationale:
#   default-src 'self'   — same-origin only unless overridden below.
#   script-src 'self'    — no inline scripts. Vite emits external hashed bundles,
#                          so this works without 'unsafe-inline' in production.
#   style-src            — 'unsafe-inline' is required because React inline style
#                          props and many component libraries inject <style>.
#                          Removing it needs a nonce/hash strategy at build time.
#   img-src data: blob:  — data: for inline SVG/placeholder icons, blob: for
#                          client-side previews of images before upload.
#   connect-src          — the SPA calls the API on a DIFFERENT origin, so it
#                          must be allowed explicitly or every request is
#                          blocked. A browser that uploads straight to an object
#                          store names that host here too — and NOT through
#                          CSP_API_ORIGIN, because that value also fills
#                          frame-src and nothing from a storage host may be
#                          framed.
#   frame-src            — only the API origin may be embedded (a file viewer).
#   frame-ancestors      — nothing may embed the app; blocks clickjacking of
#                          high-value actions.
#   object-src 'none'    — no Flash/Java/embed; a pure legacy attack surface.
#   upgrade-insecure-requests — rewrite any stray http:// subresource to https.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CSP_API_ORIGIN}; frame-src 'self' ${CSP_API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
