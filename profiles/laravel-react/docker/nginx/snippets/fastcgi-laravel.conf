# =============================================================================
# FastCGI parameters for Laravel
# -----------------------------------------------------------------------------
# Included from inside the `location ~ \.php$` block of each Laravel vhost.
# Kept in one place so the dev and prod vhosts cannot drift apart.
# =============================================================================

# Nginx's stock parameter set (QUERY_STRING, REQUEST_METHOD, CONTENT_TYPE, ...).
include fastcgi_params;

# -----------------------------------------------------------------------------
# Script resolution — the security-critical part
# -----------------------------------------------------------------------------
# $realpath_root, not $document_root: it resolves symlinks to their true path.
# On an atomic-symlink deploy (release/current -> release/2026-08-12) using
# $document_root makes OPcache key its cache on the stable symlink path, so the
# old code keeps being served after a release flips the symlink.
fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT   $realpath_root;

# -----------------------------------------------------------------------------
# Proxy awareness
# -----------------------------------------------------------------------------
# TLS terminates upstream at the platform load balancer, so Nginx sees plain
# HTTP. Passing the original scheme through lets Laravel generate correct
# https:// URLs for password resets, payment callbacks, and signed routes.
# Laravel must also be configured to trust the proxy (TrustProxies middleware),
# or it will ignore these headers — that is the correct default, since an
# untrusted client could otherwise forge them.
fastcgi_param HTTPS            $https_flag if_not_empty;
fastcgi_param REQUEST_SCHEME   $forwarded_scheme;
fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_scheme;

# Correlation id, so a PHP log line can be joined to the Nginx access log entry
# and to the load-balancer log for the same request.
fastcgi_param HTTP_X_REQUEST_ID $request_id_final;

# -----------------------------------------------------------------------------
# Hardening
# -----------------------------------------------------------------------------
# PATH_INFO is blanked to close the classic FPM path-traversal class of bug
# (`/uploads/evil.jpg/.php`), where a crafted path convinces FPM to execute a
# non-PHP uploaded file. Laravel routes from REQUEST_URI and never reads
# PATH_INFO, so blanking it costs nothing.
fastcgi_param PATH_INFO "";

# Do not wait forever on a wedged worker; see fastcgi_read_timeout in nginx.conf.
fastcgi_index index.php;
