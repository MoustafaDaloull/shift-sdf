# =============================================================================
# Baseline security response headers
# -----------------------------------------------------------------------------
# `always` is required on every one of these: without it Nginx omits the header
# on error responses (4xx/5xx), which is exactly where a clickjacking or MIME
# sniffing protection still matters.
# =============================================================================

# Block MIME-type sniffing. Without it a browser may execute an uploaded file
# that we serve as text/plain because its bytes look like JavaScript.
add_header X-Content-Type-Options "nosniff" always;

# Disallow framing entirely. Nothing on the platform is designed to be embedded
# in a third-party page, and permitting it enables clickjacking against
# high-value actions.
#
# If one path must be frameable by the web origin (a PDF viewer in an iframe),
# X-Frame-Options cannot name an allowed origin: replace the literal with a
# `map $request_uri` variable that is empty for that prefix (nginx then omits
# the header) and let `frame-ancestors` in csp-api.conf restrict those
# responses to the web origin. The profile ships the strict default.
add_header X-Frame-Options "DENY" always;

# Send only the origin on cross-origin navigation. Full URLs leak record
# identifiers into third-party referrer logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Drop powerful browser APIs the platform does not use. Camera stays available
# because document capture during registration may need it; revisit per module.
add_header Permissions-Policy "geolocation=(self), microphone=(), payment=()" always;

# Echo the correlation id back so a user reporting a failure can quote an id
# that maps directly to the Nginx and PHP log entries.
add_header X-Request-Id $request_id_final always;

# -----------------------------------------------------------------------------
# Deliberately NOT set here
# -----------------------------------------------------------------------------
# Strict-Transport-Security: TLS terminates at the platform load balancer,
#   which is the correct place to own HSTS. Setting it here as well risks a
#   duplicate header, and emitting it in local development (plain HTTP) would
#   pin the browser to https://localhost and break the dev environment in a way
#   that persists until the user clears their HSTS cache.
#
# Content-Security-Policy: intentionally not here, because the API and the SPA
#   need genuinely different policies. It lives in csp-api.conf (enforcing,
#   `default-src 'none'`) and csp-spa.conf (report-only until the React app
#   exists). Each vhost includes the one that applies to it.
