# =============================================================================
# Liveness endpoint — answered by Nginx alone
# -----------------------------------------------------------------------------
# WHY this does not touch PHP:
#   A container healthcheck must report the health of THAT container only. If
#   /healthz were proxied to PHP-FPM, then a Laravel bootstrap error (or a DB
#   outage surfaced through a Laravel health route) would mark Nginx unhealthy
#   and restart it — restarting a process that was working perfectly, while the
#   real fault goes unaddressed.
#
#   Deeper checks (database reachable, Redis reachable, queue draining) belong
#   on a separate application route such as /up, which Laravel owns and which a
#   READINESS probe — not a liveness probe — should call.
#
# access_log off: the healthcheck fires every 15s per container and would
# otherwise dominate the log volume and its cost in the log collector.
# =============================================================================

location = /healthz {
    access_log off;

    # `default_type`, NOT `add_header Content-Type`.
    #
    # nginx inherits add_header directives from the enclosing block ONLY if the
    # current block declares none of its own. Adding a single add_header here
    # would therefore silently drop every security header set at server level
    # (X-Frame-Options, Referrer-Policy, X-Request-Id, ...) for this location.
    # default_type sets the content type without triggering that reset.
    default_type text/plain;

    return 200 "healthy\n";
}
