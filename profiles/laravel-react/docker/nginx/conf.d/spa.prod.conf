# =============================================================================
# {{PROJECT_NAME}} — React SPA vhost (PRODUCTION)
# -----------------------------------------------------------------------------
# Serves the compiled Vite bundle as static files. No PHP, no upstream.
# Deployed independently of the API (app.<domain> vs api.<domain>), so this
# image can ship a frontend fix without touching Laravel.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-spa.conf;

    # -------------------------------------------------------------------------
    # Hashed build assets
    # -------------------------------------------------------------------------
    # Vite writes everything under /assets/ with a content hash in the filename,
    # so these URLs are immutable by construction and can be cached for a year
    # with no revalidation. This block must come BEFORE the SPA fallback, or the
    # fallback would swallow a missing asset and return index.html with a 200 —
    # which surfaces much later as "unexpected token '<'" in the console.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA history fallback
    # -------------------------------------------------------------------------
    # React Router owns client-side routes such as /items/123. Those paths do
    # not exist on disk, so any unmatched request returns index.html and lets the
    # router resolve it. Without this, a hard refresh on a deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # The one file that must never be cached
    # -------------------------------------------------------------------------
    # index.html carries the <script src> pointing at the current hashed bundle.
    # If a browser caches it, that browser is pinned to the previous release
    # forever and never discovers the new asset filenames. Everything else is
    # immutable precisely BECAUSE this one file is always revalidated.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # nginx drops every inherited add_header once a location declares its
        # own, so the server-level security headers must be repeated here —
        # without this line index.html went out with no X-Frame-Options, CSP or
        # nosniff at all (measured on the reference project's staging).
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-spa.conf;
    }

    # Source maps reconstruct the original TypeScript; keep them out of public
    # reach. Upload them to an error tracker at deploy time instead.
    location ~* \.map$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        access_log off;
        log_not_found off;
        return 404;
    }

    # -------------------------------------------------------------------------
    # NOTE on API access
    # -------------------------------------------------------------------------
    # This vhost deliberately does NOT proxy /api to the backend. The SPA calls
    # api.<domain> directly using the origin baked in at build time via
    # VITE_API_BASE_URL, which keeps the two deployments independent. If a
    # single-origin setup is preferred later (to avoid CORS entirely), add a
    # `location /api/ { proxy_pass ... }` here — but that re-couples the two
    # release cycles, so it is a decision for the product owner, not a default.
}
