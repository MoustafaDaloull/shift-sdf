# =============================================================================
# {{PROJECT_NAME}} — Laravel API vhost (PRODUCTION)
# -----------------------------------------------------------------------------
# Differences from the development vhost, and why:
#   - No placeholder fallback: in production a missing front controller is a
#     failed deploy and must surface as an error, not a friendly page.
#   - Long-lived immutable caching on hashed assets.
#   - FPM status/ping are not exposed at all.
#   - Upstream host is parameterised for sidecar addressing.
# =============================================================================

# `${PHP_FPM_UPSTREAM}` is replaced at BUILD time by docker/nginx/Dockerfile
# (`api` target, build arg of the same name). Compose resolves the php
# container by service name (`php:9000`, the default). On a platform where
# nginx and php-fpm are containers of ONE service sharing the loopback
# interface, the build passes `127.0.0.1:9000`.
upstream php_fpm {
    server ${PHP_FPM_UPSTREAM};
    keepalive 32;
}

server {
    # A managed platform sends plain HTTP to the container (TLS terminates at
    # its front end) on the service's declared container port. Keep the
    # declared port and this line in step.
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-api.conf;

    # -------------------------------------------------------------------------
    # Routing
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php_fpm;
        include /etc/nginx/snippets/fastcgi-laravel.conf;
        fastcgi_keep_conn on;
    }

    # -------------------------------------------------------------------------
    # Files served by Laravel, not by nginx
    # -------------------------------------------------------------------------
    # Same block as the development vhost, and it must stay in step with it:
    # the reference project fixed the development twin and forgot this one, so
    # every uploaded photograph would have been unreachable on the first cloud
    # deployment. `^~` beats the regex, and no such file ever lives under
    # public/, so try_files goes straight to the front controller.
    location ^~ /media/ {
        try_files /nonexistent /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Static assets
    # -------------------------------------------------------------------------
    # Vite emits content-hashed filenames (app.4f3a1b.js), so the bytes behind a
    # given URL can never change. `immutable` tells the browser to skip even the
    # revalidation request for a year, which removes a round trip per asset.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Source maps must not be public: they reconstruct the original TypeScript,
    # including comments and internal API shapes, for anyone who asks.
    location ~* \.map$ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # Denied paths
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(?:env|log|sql|sqlite|yml|yaml|lock|bak|ini|config)$ {
        access_log off;
        return 404;
    }

    # FPM status and ping are intentionally absent from this vhost. Pool metrics
    # in production are collected by the monitoring agent from the container's
    # own stderr/metrics, not through a publicly routable HTTP path.
}
