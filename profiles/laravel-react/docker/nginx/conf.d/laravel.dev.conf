# =============================================================================
# {{PROJECT_NAME}} — Laravel API vhost (DEVELOPMENT)
# -----------------------------------------------------------------------------
# Serves backend/public (bind-mounted) and hands .php to the php container over
# FastCGI. Tolerates the Laravel application not existing yet.
# =============================================================================

# Named upstream rather than a literal host:port so the FPM address is declared
# once, and so Nginx surfaces a clear "upstream" error rather than a DNS error.
upstream php_fpm {
    # `php` is the Compose service name, resolved by Docker's embedded DNS.
    server php:9000;

    # Keep idle connections to FPM open. Without this every request pays a fresh
    # TCP handshake to the upstream, which is pure latency on a chatty API.
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # UTF-8 by default: an Arabic-first platform with a missing charset renders
    # Arabic error output as mojibake.
    charset utf-8;

    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-api.conf;

    # -------------------------------------------------------------------------
    # Laravel front controller
    # -------------------------------------------------------------------------
    # Serve the file if it exists, then the directory, then fall through to
    # Laravel's router. This is the canonical Laravel Nginx configuration.
    #
    # The root URI takes the `$uri/` branch: the index directive redirects it
    # internally to /index.php, which the PHP location below executes. Do NOT
    # write `try_files /index.php @placeholder` here: index.php as a non-final
    # try_files argument is served from disk as a static file, so `curl /`
    # returns PHP source instead of running it. The reference project carried
    # exactly that pre-scaffold block and removed it once Laravel existed.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # PHP execution
    # -------------------------------------------------------------------------
    # `~ \.php$` alone would let `/uploads/x.php/passthru.jpg` reach PHP, so the
    # regex is anchored and PATH_INFO is blanked in the snippet. Combined with
    # FPM's own `security.limit_extensions = .php`, arbitrary uploaded files
    # cannot be executed.
    location ~ \.php$ {
        # Refuse to pass a request to PHP for a script that does not exist.
        # Without this, Nginx forwards anything ending in .php and FPM answers
        # with a confusing 404 body carrying a 200 status in some setups.
        try_files $uri =404;

        fastcgi_pass php_fpm;
        include /etc/nginx/snippets/fastcgi-laravel.conf;

        # keepalive to the upstream requires HTTP/1.1 with no Connection header.
        fastcgi_keep_conn on;
    }

    # -------------------------------------------------------------------------
    # FPM pool status — internal only
    # -------------------------------------------------------------------------
    # Exposes worker saturation, which is how you tell "the app is slow" from
    # "the pool is full". Restricted to RFC1918 space so it is reachable from
    # the Compose network and from a debugging shell, but never from the public
    # internet if this config is ever reused behind a real ingress.
    # The public path is remapped onto the `pm.status_path` / `ping.path` values
    # declared in the FPM pool, so the internal names are not guessable from the
    # outside.
    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME     /status;
        fastcgi_param SCRIPT_FILENAME /status;
    }

    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME     /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
    }

    # -------------------------------------------------------------------------
    # Files served by Laravel, not by nginx
    # -------------------------------------------------------------------------
    # A Laravel filesystem disk with `serve: true` registers GET /media/{path}
    # and streams a file out of storage/ through the front controller. Those
    # URLs end in .jpg/.mp4, so without this block the static-asset location
    # below catches them first, looks for the file under public/ and answers
    # 404 — every uploaded photograph in the reference development stack was
    # unreachable until this was added. `^~` wins over the regex location, and
    # the try_files falls straight through to the front controller because no
    # such file ever lives under public/.
    #
    # Rename the prefix to match the disk's `url`, or remove the block if the
    # project serves no files through Laravel.
    location ^~ /media/ {
        try_files /nonexistent /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Static assets
    # -------------------------------------------------------------------------
    # In development, do NOT cache: a stale asset that survives a rebuild is a
    # confusing bug hunt. Production sets long-lived immutable caching instead.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Denied paths
    # -------------------------------------------------------------------------
    # Dotfiles: blocks .env, .git, .htaccess. `deny all` returns 403; using
    # `return 404` instead avoids confirming that the file exists at all.
    # ACME's well-known path is excluded so certificate issuance still works.
    location ~ /\.(?!well-known).* {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Never serve source or dependency files even if someone misconfigures the
    # document root to point at the application root instead of public/.
    #
    # `.json` and `.md` are deliberately NOT in this list: public/manifest.json
    # is a legitimate PWA asset, and blocking the extension wholesale would
    # break it for a threat that the dotfile rule and a correct document root
    # already cover.
    location ~* \.(?:env|log|sql|sqlite|yml|yaml|lock|bak|ini|config)$ {
        access_log off;
        return 404;
    }
}
