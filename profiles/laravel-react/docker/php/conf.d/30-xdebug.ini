; =============================================================================
; {{PROJECT_NAME}} — Xdebug 3 (development image only)
; -----------------------------------------------------------------------------
; Loaded last so it can override anything above it.
; =============================================================================

[xdebug]
; -----------------------------------------------------------------------------
; Mode
; -----------------------------------------------------------------------------
; `develop` gives readable var_dump output and better error messages at near-zero
; cost. `debug` (step debugging) is intentionally NOT enabled by default because
; it makes Xdebug attempt a connection back to the IDE on every single request,
; which slows the whole stack down even when nobody is debugging.
;
; Turn step debugging on per-session instead, without editing this file:
;   XDEBUG_MODE=debug docker compose up -d php
; or, for a one-off command:
;   docker compose exec -e XDEBUG_MODE=debug php php artisan some:command
;
; Coverage for `artisan test --coverage` is enabled the same way:
;   XDEBUG_MODE=coverage
xdebug.mode = ${XDEBUG_MODE}

; Only open a debug connection when the request explicitly asks for one (via the
; browser extension or an XDEBUG_TRIGGER cookie/query param). `yes` would try to
; connect on every request and stall for the full connect timeout when the IDE
; is closed.
xdebug.start_with_request = trigger

; -----------------------------------------------------------------------------
; IDE connection
; -----------------------------------------------------------------------------
; Docker Desktop on Windows/WSL2 resolves `host.docker.internal` to the host.
; The compose file also adds an explicit extra_hosts entry so this keeps working
; on plain Linux Docker Engine, where the alias does not exist by default.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Identifies this project in the IDE when several containers debug at once.
; TODO-GENERALIZE: set to the project's short upper-case slug.
xdebug.idekey = APP

; Maps the in-container path back to the host checkout so the IDE opens the
; right file. The container side must match the WORKDIR used by compose.
; The IDE side is configured in the IDE, not here.
xdebug.discover_client_host = false

; Fail fast instead of hanging the request when no IDE is listening.
xdebug.connect_timeout_ms = 200

; -----------------------------------------------------------------------------
; Output quality
; -----------------------------------------------------------------------------
; Laravel stack traces are deep; the defaults truncate exactly the frames you
; need. These limits cost nothing in `develop` mode.
xdebug.max_nesting_level = 512
xdebug.var_display_max_depth = 8
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 2048

; Write Xdebug's own diagnostics to stderr so they appear in `docker compose logs`
; rather than vanishing into a file inside the container.
xdebug.log_level = 0
