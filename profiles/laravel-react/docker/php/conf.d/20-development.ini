; =============================================================================
; {{PROJECT_NAME}} — development overlay
; -----------------------------------------------------------------------------
; Optimised for feedback speed and debuggability, NOT for performance or safety.
; This file is copied only into the `development` build target.
; =============================================================================

[PHP]
; Surface every notice and deprecation while the codebase is being written. A
; deprecation caught on day one is free; caught after launch it is a migration.
error_reporting = E_ALL
display_errors = On
display_startup_errors = On

; NOTE: no `disable_functions` override is needed. The baseline layer does not
; set it (only 20-production.ini does), so the development image keeps the full
; function set that Composer, PECL, and local tooling require.

[PHP-Limits]
; Xdebug's step debugger and stack traces are memory-hungry, and local artisan
; commands (migrations with seeders, IDE helper generation) need headroom.
memory_limit = 512M

; No execution ceiling while step-debugging — a breakpoint pause must not be
; killed by the request timer.
max_execution_time = 0

[opcache]
; THE critical development setting: re-check file mtimes on every request so an
; edit on the host is live on the next refresh with no container restart.
; revalidate_freq=0 means "check every single time".
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
