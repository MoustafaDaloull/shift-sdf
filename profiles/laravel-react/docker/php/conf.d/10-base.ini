; =============================================================================
; {{PROJECT_NAME}} — baseline PHP configuration (all environments)
; -----------------------------------------------------------------------------
; Loaded first (prefix 10). Environment overlays (20-development / 20-production
; / 30-xdebug) are loaded after and win on any overlapping directive.
; =============================================================================

[PHP]
; -----------------------------------------------------------------------------
; Security
; -----------------------------------------------------------------------------
; Do not advertise the PHP version in response headers. Removes a free
; fingerprinting signal for anyone probing the API surface.
expose_php = Off

; NOTE: `disable_functions` is deliberately NOT set here — it lives in
; 20-production.ini instead.
;
; Disabling exec/shell_exec/popen at this layer breaks the image BUILD: PECL
; (used to compile Xdebug) shells out through PEAR's OS_Guess to detect the
; platform, and with those functions disabled it aborts with an opaque
; "thrown in OS/Guess.php" error that does not mention the real cause.
;
; Since the restriction is a production hardening measure and the development
; image must be able to compile extensions and run Composer scripts, applying
; it only in the production overlay is both safer and more accurate.

; Never let PHP guess a file that does not exist — off by default in modern PHP
; but pinned explicitly because a stray include is a real vulnerability class.
allow_url_include = Off
allow_url_fopen = On

[Date]
; UTC at the runtime level, so every container agrees on wall-clock time
; regardless of host locale. The DISPLAY zone is an application concern
; (config/app.php + a presentation helper), not a PHP-level one: a runtime
; zone that differs from the database's UTC makes every boundary ("today",
; "this month") ambiguous. Change this only by project decision.
date.timezone = "UTC"

[Session]
; Sessions live in Redis (approved architecture), not on local disk. Keeping the
; handler explicit here documents that no container-local session state exists,
; which is what makes the app horizontally scalable.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

[PHP-Limits]
; -----------------------------------------------------------------------------
; Resource limits
; -----------------------------------------------------------------------------
; 256M is comfortable for Laravel request handling. Queue workers that process
; large media get a higher limit via the CLI override in compose, not here.
memory_limit = 256M

; UPLOAD SIZE — read this before touching the two numbers below.
;
; The ceiling that decides whether an upload is accepted belongs to the
; APPLICATION's configurable settings, not to PHP. These two numbers must
; therefore never be the binding constraint: PHP drops an oversized file
; before the application runs, and the request then surfaces as a generic
; "file is required" validation error that says nothing about size and hides
; the application's real answer. The reference project measured exactly that
; — a 44MB video refused at the old 32M ceiling with a misleading message.
;
; Size them ABOVE the largest upload the product accepts (the reference
; project's largest was a 500MB video, hence 512M/520M), and keep nginx's
; `client_max_body_size` >= post_max_size, or nginx answers 413 before PHP
; ever sees the request. Uploads stream to a temp file, so raising these does
; not raise FPM memory use.
upload_max_filesize = 512M
post_max_size = 520M
max_file_uploads = 20

; A web request that runs longer than 60s should fail and be retried, not hold
; an FPM worker hostage. Long work belongs in the queue.
max_execution_time = 60
max_input_time = 60

; Admin review screens submit large forms; the PHP default of 1000 input vars
; is tight for nested arrays in review payloads.
max_input_vars = 3000

[Errors]
; Log to stderr so Docker (and therefore the log collector) captures everything.
; Writing to a file inside the container would strand logs in a dead container.
error_log = /proc/self/fd/2
log_errors = On

[Performance]
; Resolving realpath() on every include is measurable overhead on a framework
; with thousands of files. 4M with a 10-minute TTL is the common Laravel tuning.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

[opcache]
; Baseline OPcache. Whether compiled scripts are re-validated against the
; filesystem is the single biggest dev/prod difference and is set in the
; environment overlays, NOT here.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; Laravel plus its dependencies comfortably exceeds 10k files.
opcache.max_accelerated_files = 20000
