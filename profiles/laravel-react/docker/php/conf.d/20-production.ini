; =============================================================================
; {{PROJECT_NAME}} — production overlay
; -----------------------------------------------------------------------------
; Optimised for throughput and for not leaking internals to callers.
; Copied only into the `production` build target.
; =============================================================================

[PHP]
; -----------------------------------------------------------------------------
; Dangerous function lockdown
; -----------------------------------------------------------------------------
; Applied ONLY in production, for two reasons:
;   1. It is a hardening measure — it reduces the blast radius of a file-upload
;      or deserialization bug from "read a file" to "cannot spawn a shell".
;   2. Applying it earlier breaks the image build, because PECL compiles
;      extensions by shelling out. See the note in 10-base.ini.
;
; `proc_open` is intentionally NOT in this list: Laravel's Process facade and
; several queue/notification paths depend on it. Everything here is a function
; Laravel core never calls at runtime.
; `pcntl_fork` is also absent: it cannot execute arbitrary code on its own, and
; blocking it risks breaking worker supervision for no real gain.
; `pcntl_exec` — which does execute a new program — is blocked.
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec

; Never render a stack trace to an API consumer: it leaks file paths, framework
; versions, and sometimes credentials from the local variable dump. Errors are
; logged to stderr and picked up by the log collector instead.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

[opcache]
; -----------------------------------------------------------------------------
; The single most important production PHP setting.
; -----------------------------------------------------------------------------
; The image is immutable: source code cannot change while the container runs.
; Therefore stat()-ing every file on every request is pure waste. Disabling
; timestamp validation typically buys a double-digit percentage throughput win.
;
; CONSEQUENCE: a code change requires a new image and a new revision. That is
; exactly the deployment model we want — never edit a running container.
opcache.validate_timestamps = 0

; Cache the resolved absolute path of every include, skipping realpath lookups.
opcache.save_comments = 1
opcache.enable_file_override = 1

; JIT: `tracing` mode with a 128M buffer. Laravel is I/O-bound rather than
; CPU-bound so the win is modest, but it is free and non-breaking on PHP 8.x.
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; -----------------------------------------------------------------------------
; OPcache preloading — deferred, not enabled
; -----------------------------------------------------------------------------
; Preloading compiles a fixed set of classes into shared memory at startup so
; they never need to be linked per request. The headline figure is attractive,
; but it is the wrong trade for a new application:
;
;   1. IT NEEDS A SCRIPT THAT DOES NOT EXIST. `opcache.preload` requires an
;      application-provided preload.php enumerating what to load. Laravel does
;      not ship one.
;
;   2. IT BREAKS SOME BINDINGS. Preloaded classes are shared across every
;      request and cannot be redefined. Laravel packages that swap
;      implementations at runtime, and anything relying on per-request container
;      state, misbehave in ways that surface as intermittent production-only
;      bugs — the most expensive category to diagnose.
;
;   3. THE GAIN IS UNMEASURED. A typical Laravel API is I/O-bound (MySQL, Redis,
;      external calls). Class-linking is unlikely to be the bottleneck, and
;      enabling an optimisation before measuring it is how complexity gets
;      added for no return.
;
; REVISIT WHEN: production profiling shows meaningful time in class loading.
; At that point create backend/preload.php, set the two directives below, and
; verify against the real workload — not before.
;
;   opcache.preload      = /var/www/html/preload.php
;   opcache.preload_user = app
;
; The JIT and timestamp-validation settings above already capture the large,
; low-risk share of the available performance win.
