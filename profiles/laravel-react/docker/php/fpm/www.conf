; =============================================================================
; {{PROJECT_NAME}} — PHP-FPM pool configuration
; -----------------------------------------------------------------------------
; Filename is prefixed `zz-` so it loads AFTER the stock www.conf shipped in the
; official image and overrides it. We override rather than replace so that any
; upstream default we did not think about is still inherited.
; =============================================================================

[global]
; -----------------------------------------------------------------------------
; Master process
; -----------------------------------------------------------------------------
; Send the FPM master's own log to stderr -> Docker -> the log collector.
error_log = /proc/self/fd/2

; Do not daemonize: Docker needs PID 1 to stay in the foreground, otherwise the
; container exits immediately after start.
daemonize = no

; Restart workers if 10 of them die within a minute. Protects against a crash
; loop caused by a single poisoned request taking the whole pool down silently.
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
; -----------------------------------------------------------------------------
; Identity
; -----------------------------------------------------------------------------
; Workers run as the unprivileged app user created in the Dockerfile. The values
; are read from the environment so a single config serves any uid/gid chosen at
; build time (important for WSL2 bind-mount ownership).
user = ${APP_USER}
group = ${APP_USER}

; -----------------------------------------------------------------------------
; Socket
; -----------------------------------------------------------------------------
; TCP, not a unix socket: Nginx runs in a SEPARATE container, and a unix socket
; cannot be shared across container boundaries without a shared volume (which
; would add a failure mode for no benefit). 0.0.0.0 is safe because the port is
; published only to the internal Compose network, never to the host.
listen = 0.0.0.0:9000
listen.backlog = 511

; -----------------------------------------------------------------------------
; Process manager
; -----------------------------------------------------------------------------
; `dynamic` scales workers with load, which suits a development box where the
; stack sits idle most of the time. compose.prod.yaml overrides PHP_FPM_PM to
; `static`: a managed instance serves a bounded concurrency, so a fixed pool
; avoids fork latency on the request path.
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}

; Recycle a worker after N requests. This is the standard mitigation for slow
; memory growth in long-lived PHP processes (extension leaks, static caches).
; 0 would mean "never recycle".
pm.max_requests = 500

; -----------------------------------------------------------------------------
; Health and observability endpoints
; -----------------------------------------------------------------------------
; /ping answers `pong` over FastCGI. The container HEALTHCHECK calls this via
; cgi-fcgi, which tests FPM itself WITHOUT involving Nginx or any application
; code. That separation matters: a broken Laravel route must not mark the PHP
; container unhealthy and trigger a pointless restart.
ping.path = /ping
ping.response = pong

; Worker pool metrics (active/idle/queued). Nginx exposes this only on the
; internal network; it is never routed publicly.
pm.status_path = /status

; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
; Capture anything a worker writes to stdout/stderr (including Laravel's own
; error output) and forward it to the master's stderr.
catch_workers_output = yes

; Do NOT prefix each captured line with FPM's own decoration. Laravel emits
; structured JSON logs in production; prefixing would corrupt them and break
; the collector's JSON parsing.
decorate_workers_output = no

; Access log to stdout. Nginx also logs, but the FPM access log is what tells
; you the time spent inside PHP as opposed to time spent in the proxy.
access.log = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Log any request slower than this with a full PHP stack trace, so slow
; endpoints self-identify instead of needing a profiler run to find them.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; Hard kill a request that exceeds this. Set above max_execution_time so PHP's
; own timeout fires first and produces a usable error; this is the backstop for
; a request stuck in a C extension where PHP's timer cannot interrupt it.
request_terminate_timeout = 120s

; -----------------------------------------------------------------------------
; Environment
; -----------------------------------------------------------------------------
; CRITICAL: FPM clears the environment for workers by default, which would hide
; every variable Compose or the platform injects (DB_HOST, REDIS_HOST, secrets)
; from Laravel's config. Without this line the app cannot read its own
; configuration.
clear_env = no

; -----------------------------------------------------------------------------
; Security
; -----------------------------------------------------------------------------
; Only execute .php files. Blocks the classic attack where an uploaded
; `avatar.php.jpg` (or a path-traversal SCRIPT_FILENAME) gets executed by FPM.
security.limit_extensions = .php
