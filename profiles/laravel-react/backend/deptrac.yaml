# =============================================================================
# بوابة الحدود المعمارية
# -----------------------------------------------------------------------------
# هذا الملف يفرض القواعد التي تفصل Modular Monolith عن كتلة متشابكة:
#
#   RS-020  لا استيراد مباشر عبر حدود الموديولات
#   RS-023  العبور عبر Shared/Contracts حصرًا
#   RS-025  لا اعتمادية دائرية
#
# لماذا تُفرض آليًا: خرق هذه القواعد **لا يُنتج عطبًا فوريًا** — يُنتج دَينًا
# لا يظهر إلا يوم محاولة فصل موديول كخدمة مستقلة، وحينها يكون العلاج إعادة
# كتابة لا إصلاحًا. المراجعة البشرية لا تلتقط استيرادًا واحدًا في ملف من
# ثلاثين.
#
# ما لا يفحصه Deptrac (فحوص نصية في scripts/arch-check.sh):
#   RS-014  migrations خارج مجلد الموديول
#   RS-016  مسارات مُعرَّفة في routes/api.php
#   RS-021  JOIN عابر لبادئتَي جدولين
#   RS-022  FOREIGN KEY عابر للموديولات
#
# ── كيف يُضاف موديول ────────────────────────────────────────────────────
# ثلاثة مواضع، مع أول شريحة للموديول لا بعدها («الطبقة تُستحدث مع أول
# شريحة» — موديولان في المشروع المرجعي بُنيا بشرائحَ كاملةٍ وبوابةُ الحدود
# لا تراهما):
#   1. طبقة `- name: <ModuleName>` بمجمّع `app/Modules/<ModuleName>/.*`
#   2. صفّ في `ruleset` يسمح بـSharedContracts وSharedSupport — و`SharedEvents`
#      **يومَ يُستعمل لا قبله**: منحُ إذنٍ قبل استعماله يُخفي يومَ استُعمل
#   3. اسم الطبقة في قائمة `AppCore`
# ثم أثبِت الطبقة بخرق متعمَّد (استيراد صنف من موديول آخر ⟵ أحمر) قبل
# الاعتماد عليها.
# =============================================================================

deptrac:
  paths:
    - ./app

  # المُصدِرات المُفعَّلة.
  #
  # `use` مُضاف عمدًا: المُصدِر الافتراضي يفحص المراجع الفعلية في الكود،
  # فيمر استيراد `use` غير مستخدَم بلا رصد. الاستيراد غير المستخدَم ليس ضررًا
  # في ذاته، لكنه **نية عبور مُعلَنة** تسبق الاستخدام بخطوة واحدة، ورصده أرخص
  # من رصده بعد البناء عليه.
  analyser:
    types:
      - class
      - class_superglobal
      - use
      - file
      - function
      - function_call
      - function_superglobal

  layers:
    # ── طبقة لكل موديول ────────────────────────────────────────────────────
    # TODO-GENERALIZE: أضف طبقةً لكل موديول من موديولات مشروعك على هذا الشكل.
    - name: Example
      collectors:
        - type: directory
          value: app/Modules/_Example/.*

    # ── العقود المشتركة — السطح الوحيد المسموح للعبور (RS-023) ────────────
    - name: SharedContracts
      collectors:
        - type: directory
          value: app/Shared/Contracts/.*

    # ── عقود الأحداث — السطح الثاني المسموح للعبور، ولسبب الأول نفسِه ─────
    #
    # موديولٌ يُعلن واقعةً وآخرُ يلتقطها لا يجوز أن يستورد أحدهما صنف الآخر
    # (`RS-020` · `RS-023`)، فيسكن عقدُ الحدث هنا كما يسكن عقدُ الاستدعاء في
    # `Shared/Contracts`.
    - name: SharedEvents
      collectors:
        - type: directory
          value: app/Shared/Events/.*

    # ── بقية المشترك: أدوات عامة بلا منطق أعمال ───────────────────────────
    - name: SharedSupport
      collectors:
        - type: directory
          value: app/Shared/(Http|Exceptions|Support|OpenApi)/.*

    # ── طبقة التطبيق العامة (Providers · Http الأساسي) ────────────────────
    - name: AppCore
      collectors:
        - type: directory
          value: app/(Providers|Http)/.*

  ruleset:
    # كل موديول يرى العقود المشتركة والأدوات العامة — ولا يرى موديولًا آخر.
    #
    # غياب أسماء الموديولات الأخرى من هذه القوائم هو **جوهر الملف**:
    # أي استيراد عابر يصبح خرقًا يُفشِل البناء بدل أن يمر بصمت.
    Example:
      - SharedContracts
      - SharedSupport

    # العقود لا تعتمد على شيء — واجهات مجردة فقط.
    # قائمة فارغة مقصودة: عقد يستورد تنفيذًا يُبطل غرضه.
    SharedContracts: ~

    # وعقدُ الحدث كعقدِ الاستدعاء: بياناتٌ مجرَّدةٌ لا تعرف مُعلِنًا ولا ملتقِطًا.
    SharedEvents: ~

    SharedSupport: ~

    # نواة التطبيق تربط العقود بتنفيذها، فترى الموديولات والعقود معًا.
    # هذا هو الموضع **الوحيد** المسموح فيه بمعرفة أكثر من موديول.
    AppCore:
      - Example
      - SharedContracts
      - SharedEvents
      - SharedSupport
